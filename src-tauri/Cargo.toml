[package]
name = "smpltrek-kit-builder"
version = "0.2.0"
description = "STK Forge"
authors = ["STK Forge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "smpltrek_kit_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
walkdir = "2"
regex = "1"
dirs = "5"

# WAV parsing/normalization: hand-rolled RIFF reader, no external audio dep

[dev-dependencies]
