# Builds the downloadable macOS and Windows binaries and attaches them to a
# DRAFT GitHub Release. Nothing becomes public until you press Publish.
#
# Builds are UNSIGNED on purpose: signing costs an Apple Developer membership
# and a Windows certificate, and this is an independent beta project. The consequence is
# documented for users in README.md ("Download and install"). To sign later, add
# the secrets below — the workflow already passes them through, so no rewrite is
# needed:
#   macOS   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#           APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Windows WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build ${{ matrix.name }}
    permissions:
      # tauri-action creates the release and uploads the binaries.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            args: --target universal-apple-darwin
          - os: windows-latest
            name: Windows
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # setup-node must come AFTER pnpm/action-setup: its pnpm cache resolution
      # needs pnpm already on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # A tag must never ship code that fails the gates.
      - name: Verify before publishing
        run: |
          pnpm check
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # Builds the bundles, creates the draft release on the first runner to
      # finish, and attaches this platform's artifacts to it.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: STK Forge v__VERSION__ Beta
          releaseBody: |
            Beta build. Verify every output on the exact SmplTrek hardware
            and firmware you intend to use.

            **These builds are not code-signed.** macOS and Windows will warn you
            the first time you open the app — see "Download and install" in the
            README for the exact steps.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
