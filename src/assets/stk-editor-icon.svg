<!-- BRIEF: STK Editor brand mark. Minimal STK monogram in warm copper, a single copper underline, and an anthracite hardware-style panel. High contrast at small sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">STK Editor logo</title>
  <desc id="desc">Minimal copper STK monogram on an anthracite rounded-square panel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c343a"/><stop offset="1" stop-color="#121619"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe09a"/><stop offset="0.5" stop-color="#f1c76b"/><stop offset="1" stop-color="#b8731d"/></linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/></filter>
  </defs>
  <rect id="background-panel" width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect id="copper-frame" x="54" y="54" width="916" height="916" rx="194" fill="none" stroke="url(#copper)" stroke-width="22"/>
  <rect id="inner-frame" x="91" y="91" width="842" height="842" rx="164" fill="none" stroke="#59616a" stroke-width="7"/>
  <g id="monogram" filter="url(#soft-shadow)" fill="url(#copper)">
    <text x="512" y="565" text-anchor="middle" font-family="SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="316" font-weight="800" letter-spacing="-34">STK</text>
    <rect id="underline" x="250" y="660" width="524" height="34" rx="17"/>
  </g>
  <circle id="status-led" cx="800" cy="202" r="18" fill="#ffcd52"/>
</svg>
